name: Deploy API → VPS

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/facuma/mi-rotaract-api

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy and migrate
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ github.sha }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE_TAG,GHCR_PAT
          script: |
            set -e

            # Authenticate with GHCR
            echo "$GHCR_PAT" | docker login ghcr.io -u facuma --password-stdin

            # Pull the exact image built in CI and re-tag as latest
            docker pull ghcr.io/facuma/mi-rotaract-api:"$IMAGE_TAG"
            docker tag ghcr.io/facuma/mi-rotaract-api:"$IMAGE_TAG" ghcr.io/facuma/mi-rotaract-api:latest

            cd /opt/mi-rotaract

            # Recreate API container (DB and Redis are left untouched)
            docker compose -f docker-compose.prod.yml up -d --no-build --no-deps --force-recreate api

            # Wait for container to be ready, then run migrations
            echo "Waiting for API to start..."
            sleep 8
            docker exec mi-rotaract-api \
              /app/node_modules/.bin/prisma migrate deploy \
              --schema=/app/apps/api/prisma/schema.prisma

            # Remove dangling images
            docker image prune -f

            echo "Deploy complete."
